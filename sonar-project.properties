# SonarQube / SonarQube Cloud analysis of the fork.
sonar.projectKey=pggoulot
sonar.projectName=pggoulot
sonar.sources=.
sonar.exclusions=**/testdata/**,**/*_test.go,web/tests/**,web/app.bundle.js,web/*.min.js,web/quellog.html,web/wasm_exec_tiny.js,**/node_modules/**,docs/**,site/**,tools/**
