# Every merge into main: the tests, the fork's checks, every security check
# and SonarQube run first; only when all pass are the packages built
# (binaries, archives, .deb and .rpm, checksums, SBOMs), attested and
# attached to the run for 30 days, to try them before tagging a release.
# Work happens on dev; a release is a v* tag on main (release-pggoulot.yml).
name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time; when merges pile up, only the latest waiting one runs
# (the packages of the newest main are the ones that matter).
concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] the documented local form

  fork-checks:
    uses: ./.github/workflows/fork-checks.yml # zizmor: ignore[self-repository] the documented local form

  security:
    uses: ./.github/workflows/security.yml # zizmor: ignore[self-repository] the documented local form
    permissions:
      contents: read
      security-events: write

  sonarqube:
    uses: ./.github/workflows/sonarqube.yml # zizmor: ignore[self-repository] the documented local form
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  packages:
    needs: [tests, fork-checks, security, sonarqube]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=publish --config .goreleaser-pggoulot.yml
      - name: Provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pggoulot-packages
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.sbom.json
            dist/checksums.txt
          retention-days: 30
