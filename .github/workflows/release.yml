name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # Fork: the original project's release; pggoulot has release-pggoulot.yml.
    if: github.repository == 'Alain-L/quellog'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Pinned above go.mod's minimum: the release binaries embed the
          # standard library, so they must be built with a supported Go.
          # Keep ci.yml and release.yml on the same version.
          go-version: '1.27.x'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}