name: CI

# On main, this runs inside main.yml (a merge is tested before its packages
# are built); on dev and pull requests, on its own.
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned above go.mod's minimum: the release binaries embed the
          # standard library, so they must be built with a supported Go.
          # Keep ci.yml and release.yml on the same version.
          go-version: '1.27.x'

      - name: Cache Go build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Generate web assets
        run: go generate ./web/...

      - name: Check formatting (gofmt -s)
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files not gofmt -s'd:"
            echo "$unformatted"
            echo ""
            echo "Diff:"
            gofmt -s -d .
            exit 1
          fi

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@54455593555daf6bfcf3c480faaada7de3145357 # 2026.2.2

      - name: Vet, Lint & Test
        run: |
          go vet ./...
          staticcheck ./...
          go test -race ./... -cover -timeout 30m

      - name: Build CLI
        run: go build -v -o bin/quellog .

      # TinyGo 0.39 accepts Go 1.19 through 1.25 only, so the WASM check gets
      # its own Go. 1.25: go.mod requires it since klauspost/compress 1.20.
      - name: Setup Go for TinyGo
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'

      - name: Install TinyGo
        run: |
          wget -q https://github.com/tinygo-org/tinygo/releases/download/v0.39.0/tinygo_0.39.0_amd64.deb
          sudo dpkg -i tinygo_0.39.0_amd64.deb

      - name: WASM build check (TinyGo, gc=leaking)
        run: tinygo build -o /tmp/quellog_tiny.wasm -target wasm -gc=leaking -no-debug ./web/wasm/main.go

      # Web JS safety net. Unit tests + contract linters are platform-independent
      # and browser-free, so they gate merges here. The visual (pixel) harness
      # stays local-only: it drives system Chrome and its baselines are rendered
      # on macOS, so Linux font rendering would diff.
      # Only node itself is needed: the unit tests and contract linters import
      # node builtins + local files (the npm deps — esbuild/pixelmatch/playwright
      # — are for bundling and the local-only visual harness), and this repo does
      # not track package-lock.json, so there is nothing to `npm ci`.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 24, not 22: the unit tests exercise Intl.DurationFormat (the module's
          # preferred path; it has a fallback for older engines), which the
          # runner's Node 22 lacks.
          node-version: '24'

      - name: Web unit + contract tests
        run: |
          npm run test:unit
          npm run test:contracts