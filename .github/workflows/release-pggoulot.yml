# Release of pggoulot: push a tag such as v0.1.0. The tests (race detector,
# fuzzing, web tests, lint) and every security check of security.yml run
# first; only when all pass does GoReleaser build the binaries, archives,
# .deb and .rpm packages, checksums and SBOMs, and each file gets a signed
# build provenance attestation (gh attestation verify).
name: Release pggoulot

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Generate web assets
        run: go generate ./web/...
      - name: Format, vet, staticcheck
        run: |
          test -z "$(gofmt -s -l .)"
          go vet ./...
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          staticcheck ./...
      - name: Tests (race detector)
        run: go test -race ./... -timeout 15m
      - name: Web tests
        run: npm run test:unit && npm run test:contracts
      - name: Fuzz the trace parsers
        run: |
          for target in FuzzSplit FuzzParsePlan FuzzTracer; do
            go test ./trace/ -run='^$' -fuzz="^$target\$" -fuzztime=30s
          done

  security:
    uses: ./.github/workflows/security.yml # zizmor: ignore[self-repository] the documented local form
    permissions:
      contents: read
      security-events: write

  sonarqube:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Configured?
        id: configured
        run: echo "ok=${{ env.SONAR_TOKEN != '' && vars.SONAR_ORGANIZATION != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.configured.outputs.ok == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.configured.outputs.ok == 'true'
        with:
          go-version: '1.27.x'
          cache: false
      - name: Coverage
        if: steps.configured.outputs.ok == 'true'
        run: |
          go generate ./web/...
          go test -coverprofile=coverage.out ./...
      - name: Quality gate
        if: steps.configured.outputs.ok == 'true'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_ORGANIZATION }}_pggoulot
            -Dsonar.qualitygate.wait=true

  release:
    needs: [verify, security, sonarqube]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Release notes from the CHANGELOG
        run: |
          awk '/^## \[/{n++} n==1' CHANGELOG.md | tail -n +2 > /tmp/notes.md
          test -s /tmp/notes.md
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --config .goreleaser-pggoulot.yml --release-notes /tmp/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
