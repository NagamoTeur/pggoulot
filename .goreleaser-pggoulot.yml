# Releases of pggoulot (.goreleaser.yml stays the original quellog's).
# Built by .github/workflows/release-pggoulot.yml on a v* tag.
version: 2
project_name: pggoulot

before:
  hooks:
    - go generate ./web/...

builds:
  - id: pggoulot
    binary: pggoulot
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: pggoulot
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - FORK.md
      - SECURITY.md
      - CHANGELOG.md
      - docs/trace.md

nfpms:
  - id: pggoulot
    package_name: pggoulot
    vendor: NagamoTeur
    homepage: https://github.com/NagamoTeur/pggoulot
    maintainer: NagamoTeur <25391072+NagamoTeur@users.noreply.github.com>
    description: |-
      Finds the bottleneck of slow PostgreSQL statements: traces with explained
      findings (English or French) in every report. Built on quellog, the
      PostgreSQL log analyzer by Alain Lesage (unofficial, not affiliated).
    license: PostgreSQL
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/pggoulot/LICENSE
      - src: README.md
        dst: /usr/share/doc/pggoulot/README.md
      - src: FORK.md
        dst: /usr/share/doc/pggoulot/FORK.md
      - src: SECURITY.md
        dst: /usr/share/doc/pggoulot/SECURITY.md
      - src: CHANGELOG.md
        dst: /usr/share/doc/pggoulot/CHANGELOG.md
      - src: docs/trace.md
        dst: /usr/share/doc/pggoulot/trace.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  disable: true

release:
  github:
    owner: NagamoTeur
    name: pggoulot
  draft: false
  prerelease: false
  header: |
    Built on [quellog](https://github.com/Alain-L/quellog) by Alain Lesage (not affiliated). See [FORK.md](https://github.com/NagamoTeur/pggoulot/blob/main/FORK.md) and the CHANGELOG.

    Verify a download: `gh attestation verify <file> -R NagamoTeur/pggoulot` and `sha256sum -c checksums.txt`.
